repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: bash -c 'cd gateway && uv run ruff check --fix .'
        language: system
        types: [python]
        pass_filenames: false
      - id: ruff-format
        name: ruff format
        entry: bash -c 'cd gateway && uv run ruff format .'
        language: system
        types: [python]
        pass_filenames: false
