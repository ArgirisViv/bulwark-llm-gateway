[project]
name = "bulwark"
version = "1.0.0"
description = "Self-hosted, OpenAI-compatible security gateway for LLM applications"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Argiris Vivelis" }]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "uvicorn[standard]>=0.54.0",
    "httpx>=0.28.1",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    "presidio-analyzer>=2.2.365",
    "PyYAML>=6.0.3",
    "jsonschema>=4.26.0",
    "SQLAlchemy[asyncio]>=2.1.6",
    "asyncpg>=0.32.0",
    "redis>=8.1.0",
    "alembic>=1.20.1",
    "prometheus-client>=0.26.0",
]

[dependency-groups]
dev = [
    "ruff>=0.17.3",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.1",
    "pytest-cov>=7.1.0",
    "types-PyYAML>=6.0.12.20260906",
    "types-jsonschema>=4.26.0.20261006",
    "aiosqlite>=0.22.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bulwark"]

# ---------- ruff ----------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F",   # pycodestyle, pyflakes
    "I",             # isort
    "B",             # bugbear
    "UP",            # pyupgrade
    "S",             # bandit (security)
    "ASYNC",         # async pitfalls
    "SIM", "RUF",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # assert is fine in tests

# ---------- mypy ----------
[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"

# ---------- pytest ----------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=bulwark --cov-report=term-missing --cov-fail-under=85"

[tool.coverage.run]
branch = true
source = ["bulwark"]

[tool.coverage.report]
exclude_also = ["\\.\\.\\.$", "if TYPE_CHECKING:"]
