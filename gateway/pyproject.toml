[project]
name = "bulwark"
version = "1.0.0"
description = "Self-hosted, OpenAI-compatible security gateway for LLM applications"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Argiris Vivelis" }]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "presidio-analyzer>=2.2.359",
    "PyYAML>=6.0",
    "jsonschema>=4.23",
    "SQLAlchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "redis>=5.2",
    "alembic>=1.14",
    "prometheus-client>=0.21",
]

[dependency-groups]
dev = [
    "ruff>=0.17.3",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "types-PyYAML>=6.0",
    "types-jsonschema>=4.23",
    "aiosqlite>=0.20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bulwark"]

# ---------- ruff ----------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F",   # pycodestyle, pyflakes
    "I",             # isort
    "B",             # bugbear
    "UP",            # pyupgrade
    "S",             # bandit (security)
    "ASYNC",         # async pitfalls
    "SIM", "RUF",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # assert is fine in tests

# ---------- mypy ----------
[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"

# ---------- pytest ----------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=bulwark --cov-report=term-missing --cov-fail-under=85"

[tool.coverage.run]
branch = true
source = ["bulwark"]

[tool.coverage.report]
exclude_also = ["\\.\\.\\.$", "if TYPE_CHECKING:"]
