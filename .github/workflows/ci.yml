name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gateway:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      - name: Type check
        run: uv run mypy src tests
      - name: Tests
        run: uv run pytest
      - name: Evaluation report
        run: uv run python ../eval/harness.py --output ../eval/reports
      - uses: actions/upload-artifact@v7
        with:
          name: eval-report
          path: eval/reports

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build gateway image
        run: docker build -t bulwark-gateway:ci gateway
      - name: Build dashboard image
        run: docker build -t bulwark-dashboard:ci dashboard
      - name: Validate compose file
        run: cp .env.example .env && docker compose config -q
