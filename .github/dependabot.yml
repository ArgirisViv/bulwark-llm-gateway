version: 2
updates:
  - package-ecosystem: pip
    directory: /gateway
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      python-dependencies:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /gateway
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
